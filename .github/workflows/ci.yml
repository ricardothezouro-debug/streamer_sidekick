name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    # macOS entra na matriz porque os bugs de plataforma que ja nos morderam
    # (pynput abortando o processo, SSL sem cert store, creationflags) so
    # aparecem fora do Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compilar (syntax check)
        run: python -m compileall -q src

      - name: Rodar testes
        run: python -m pytest -q

      - name: Smoke test da janela (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python scripts/smoke_test.py
