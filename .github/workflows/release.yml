name: Release

# Publica automaticamente ao entrar código novo na main: lê a versão do código
# e, se ainda não houver Release para ela, builda o portable e publica (criando
# a tag vX.Y.Z). Se a Release já existir, não faz nada — então commits na main
# que não mudam a versão são ignorados.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Ler versão do código
        id: ver
        shell: pwsh
        run: |
          $init = Get-Content -Raw src/streamer_sidekick/__init__.py
          $v = ([regex]::Match($init, '__version__\s*=\s*"([^"]+)"')).Groups[1].Value
          if (-not $v) { throw "Nao consegui ler __version__" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versao do codigo: $v"

      - name: A Release já existe?
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $exists = "false"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { $exists = "true" }
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release $tag existe? $exists"
          exit 0  # nao deixa o exit code do 'gh release view' derrubar o step

      - name: Instalar dependências
        if: steps.check.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt

      - name: Rodar testes
        if: steps.check.outputs.exists == 'false'
        run: python -m pytest -q

      - name: Buildar o portable
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/streamer_sidekick.spec
          powershell -ExecutionPolicy Bypass -File scripts/package_portable.ps1

      - name: Publicar a Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: release/StreamerSidekick-*-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
