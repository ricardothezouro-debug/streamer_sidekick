name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Conferir que a tag == versão do código
        shell: pwsh
        run: |
          $init = Get-Content -Raw src/streamer_sidekick/__init__.py
          $ver = ([regex]::Match($init, '__version__\s*=\s*"([^"]+)"')).Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -ne $tag) { throw "Tag $tag != versao do codigo $ver — bump esquecido?" }
          Write-Host "Versao OK: $ver"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest -q

      - name: Buildar o portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/streamer_sidekick.spec
          powershell -ExecutionPolicy Bypass -File scripts/package_portable.ps1

      - name: Publicar a Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/StreamerSidekick-*-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
